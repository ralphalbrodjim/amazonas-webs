<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#1F3B34" />
    <title>Amazonas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F3B34'/%3E%3C/svg%3E" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #F5F1E8;
        color: #1E2B27;
        font-family: Georgia, "Times New Roman", serif;
      }
      main { max-width: 720px; margin: 0 auto; padding: 48px 20px 72px; }
      .kicker {
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        letter-spacing: 0.16em;
        font-size: 12px;
        font-weight: 700;
        color: #4F7A63;
      }
      h1 { font-weight: 500; font-size: clamp(32px, 8vw, 48px); margin: 10px 0 8px; }
      p {
        margin: 0;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #6B746F;
        line-height: 1.5;
        font-size: 16px;
      }
      nav { display: grid; gap: 12px; margin-top: 28px; }
      a {
        display: block;
        text-decoration: none;
        background: #FFFDF7;
        border: 1px solid #E4DDCF;
        border-radius: 16px;
        padding: 18px;
        color: inherit;
      }
      a strong { display: block; font-size: 22px; color: #1F3B34; }
      a.warren strong { color: #0D1933; }
      a span {
        display: block;
        margin-top: 6px;
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        color: #6B746F;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="kicker">AMAZONAS</div>
      <h1>Elige un sitio</h1>
      <p>Dos páginas para abrir en el móvil, sin instalar nada.</p>
      <nav>
        <a href="chef/">
          <strong>El Chef de Antracita</strong>
          <span>Recetario, menú semanal y lista de la compra.</span>
        </a>
        <a class="warren" href="warren/">
          <strong>Warren · Investment Intelligence</strong>
          <span>Cartera, radar y valoración a tres años.</span>
        </a>
      </nav>
    </main>
  </body>
</html>
